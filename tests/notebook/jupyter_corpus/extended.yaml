# Extended Jupyter corpus.
#
# Hand-curated .ipynb files fetched at test time (cached locally) and run
# through parse → convert → dag → run → artifact by the nightly
# jupyter-corpus workflow.
#
# Every URL is pinned to a commit SHA or release tag, never `main` / `master`,
# so runs are reproducible.
#
# Adding an entry:
#   1. Pick a notebook from a stable public repo.
#   2. Use a raw.githubusercontent.com URL pinned to a commit SHA (or a tag like
#      v2.2.0).
#   3. Run `STRATA_CORPUS_RUN=1 pytest -k <name>` locally to confirm it.
#   4. ``expected: pass``: must clear all five steps.
#      ``expected: parse_only``: only parse + convert + dag are scored. Use it
#      when the notebook has aged out of current libraries, needs a GPU or
#      paid API, or downloads large data.

notebooks:
  # ---- Python Data Science Handbook (Jake VanderPlas) ----
  # Deps infer fine, but the code relies on library behavior since removed, so
  # parse_only tracks the converter / DAG side only.

  - name: pdsh-numpy-array-basics
    url: https://raw.githubusercontent.com/jakevdp/PythonDataScienceHandbook/d66231454ef753818dc9213c9b5942e067266966/notebooks/02.02-The-Basics-Of-NumPy-Arrays.ipynb
    expected: parse_only
    reason: "upstream API drift: relies on numpy view mutability that's now read-only by default"

  - name: pdsh-pandas-objects
    url: https://raw.githubusercontent.com/jakevdp/PythonDataScienceHandbook/d66231454ef753818dc9213c9b5942e067266966/notebooks/03.01-Introducing-Pandas-Objects.ipynb
    expected: parse_only
    reason: "upstream API drift: pandas.Index became immutable; old assignment patterns now raise"

  - name: pdsh-matplotlib-line-plots
    url: https://raw.githubusercontent.com/jakevdp/PythonDataScienceHandbook/d66231454ef753818dc9213c9b5942e067266966/notebooks/04.01-Simple-Line-Plots.ipynb
    expected: parse_only
    reason: "upstream API drift: 'seaborn-whitegrid' matplotlib style was renamed"

  # ---- Aurelien Geron, Hands-on Machine Learning (3rd ed) ----

  - name: handson-ml3-landscape
    url: https://raw.githubusercontent.com/ageron/handson-ml3/1fa7649974e575b4634e4b532f605b4a834a4e4a/01_the_machine_learning_landscape.ipynb
    expected: parse_only
    reason: "downloads CSVs from sklearn data URL endpoint; treat as no-network for this tier"

  # ---- Sebastian Raschka, Python Machine Learning (3rd ed) ----

  - name: pml3-ch02-perceptron
    url: https://raw.githubusercontent.com/rasbt/python-machine-learning-book-3rd-edition/bf62496f44a92a21d23250d5ed13d2d2e617e0e2/ch02/ch02.ipynb
    expected: parse_only
    reason: "fetches Iris dataset over HTTPS; treat as no-network for this tier"

  - name: pml3-ch03-classifiers
    url: https://raw.githubusercontent.com/rasbt/python-machine-learning-book-3rd-edition/bf62496f44a92a21d23250d5ed13d2d2e617e0e2/ch03/ch03.ipynb
    expected: parse_only
    reason: "uses sklearn.datasets fetch; treat as no-network for this tier"

  # ---- fast.ai book (deep learning) ----
  # Pulls model weights at runtime, so parse_only.

  - name: fastai-fastbook-intro
    url: https://raw.githubusercontent.com/fastai/fastbook/e8baa81d89f0b7be816e35f1cc813ac02038db54/01_intro.ipynb
    expected: parse_only
    reason: "fastai download_url() pulls multi-MB model weights; treat as no-network for this tier"
