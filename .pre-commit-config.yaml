repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        # Pin to the frontend's version (frontend/package.json). Bare
        # `npx prettier` gets the latest release, which can format differently
        # from the frontend's own `prettier --check` in CI, so no file state
        # would satisfy both. Keep the two in lockstep.
        name: prettier
        entry: npx prettier@3.9.5 --write --ignore-unknown
        language: system
        types_or: [javascript, jsx, ts, tsx, vue, css, json]
        # Serialize: parallel `npx prettier` runs race on the npm cache and
        # fail with ENOTEMPTY in CI.
        require_serial: true
