[project]
name = "strata-notebook"
version = "0.9.0"
description = "A notebook built for coding agents: every result cached, versioned, and visible to the human watching"
readme = "README.md"
authors = [
    { name = "Fangchen Li", email = "fangchen.li@outlook.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = [
    "notebook",
    "materialization",
    "provenance",
    "lineage",
    "reproducibility",
    "content-addressed",
    "iceberg",
    "arrow",
    "analytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
]
dependencies = [
    "pyiceberg[sql-sqlite,sql-postgres]>=0.12.0",
    "pyarrow>=18.0.0",
    "fastapi>=0.115.0",
    # FastAPI only asks for starlette>=0.46.0; 1.3.1 fixes all five 2026 advisories.
    "starlette>=1.3.1",
    # 0.35.0 adds the sans-io WebSocket protocol; server.main selects it because
    # the legacy asyncio one is deprecated and breaks on CPython 3.14+.
    "uvicorn>=0.35.0",
    "websockets>=17.1",
    "httpx>=0.28.0",
    "duckdb>=1.5.0",
    "python-multipart>=0.0.31", # Multipart form handling; 0.0.31 fixes the 2026 advisories
    "pydantic>=2.0.0",
    "pydantic-settings>=2.15.0",
    "tomli_w>=1.0.0",
    "jsonschema>=4.0.0",
    "pyyaml>=6.0", # Conda environment.yaml import
    "infisicalsdk>=1.0.16",
    "packaging>=24.0",
    "filelock>=3.24", # Cross-process locks; unlinking a held lock is race-free from 3.24
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
]
azure = [
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.25.3",
    # PyIceberg reads Azure lake tables' metadata through adlfs.
    "adlfs>=2026.0.0",
]
# Presigned build-manifest URLs (STRATA_ARTIFACT_PRESIGNED_URLS) from an S3 role
# rather than a key pair, and from GCS. Reading and writing blobs needs neither.
# Notebook `s3://` and `gs://` mounts resolve in Strata's own process, through
# s3fs and gcsfs.
s3 = [
    "botocore>=1.35.0",
    "s3fs>=2026.3.0",
]
gcs = [
    "google-cloud-storage>=3.0.0",
    "gcsfs>=2026.0.0",
]
# Postgres metadata backend for the artifact store: only needed when several
# Strata nodes share one store. Personal mode never needs it.
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
# Notebook cell runtime (harness, pool_worker, serializer): DataFrame/ndarray
# serialization, display outputs, orjson manifest I/O, and the cloudpickle
# object codec. Strata core needs none of it.
notebook = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "orjson>=3.10.0",
    "cloudpickle>=3.0.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
]
# SQL cells. Each ADBC driver has its own extra so users install only what they
# connect to.
sql = [
    "sqlglot>=30.13.0",
    "adbc-driver-manager>=1.0.0",
]
sql-postgres = [
    "adbc-driver-postgresql>=1.0.0",
]
sql-sqlite = [
    "adbc-driver-sqlite>=1.0.0",
]
sql-snowflake = [
    "adbc-driver-snowflake>=1.0.0",
]
sql-bigquery = [
    "adbc-driver-bigquery>=1.0.0",
]
sql-duckdb = [
    "duckdb>=1.5.0",
]
# Notebook TUI (`strata-notebook-tui`): a read-only Textual viewer of a running
# session over the WS protocol.
tui = [
    "textual>=0.80.0",
    # Pure-Python Sugiyama layered layout for the ASCII DAG view.
    "grandalf>=0.8",
    # Inline images. The 0.13.0 and 0.13.1 wheels hold no Python modules;
    # the first that imports is 0.14.0.
    "textual-image>=0.14.0",
    # tui/app.py imports PIL at load, so declare it rather than rely on
    # textual-image to pull it in.
    # 12.1.0 adds Image.get_flattened_data, which textual-image 0.14 calls for
    # every image.
    "pillow>=12.1.0",
]
# MCP server: exposes the live notebook session to a coding agent at `/mcp`.
# The import is gated; install this (and run in personal mode) to enable it.
mcp = [
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    # Dev-only, editable from the workspace so the combined suite can import
    # it; never a runtime dependency of strata-notebook.
    "strata-client",
    # Dev-only too (for `ty` and the suite); the notebook must run without a pool.
    "strata-pool",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    # Starlette's TestClient runs on httpx2 when it is installed and warns
    # that its httpx fallback is deprecated.
    "httpx2>=2.13.1",
    "ruff>=0.8.0",
    "moto[s3]>=5.2.3",
    "boto3>=1.35.0",
    "psutil>=5.9.0",
    # 4.15 is where testcontainers.community lives; the old top-level module
    # paths still import from there and warn.
    "testcontainers[minio]>=4.15.0",
    "polars>=1.36.1",
    "pandas>=2.3.3",
    "datafusion>=50.1.0",
    "ty>=0.0.24",
    "s3fs>=2026.3.0",
    "adlfs>=2026.0.0",
    "gcsfs>=2026.0.0",
    "sqlglot>=30.13.0",
    "adbc-driver-manager>=1.0.0",
    "adbc-driver-postgresql>=1.0.0",
    "adbc-driver-sqlite>=1.0.0",
    # The [tui] extra, so its tests can import it.
    "textual>=0.80.0",
    "grandalf>=0.8",
    "textual-image>=0.14.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.7.7",
    "mike>=2.1.0",
]

[project.scripts]
strata = "strata.cli:main"
strata-notebook = "strata.server:main"
strata-notebook-tui = "strata.notebook.tui.cli:main"
strata-worker = "strata.notebook.remote_executor:main"

[project.urls]
Homepage = "https://bearing-research.github.io/strata/"
Documentation = "https://bearing-research.github.io/strata/"
Repository = "https://github.com/bearing-research/strata"
Issues = "https://github.com/bearing-research/strata/issues"
Changelog = "https://github.com/bearing-research/strata/blob/main/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.uv]
python-preference = "only-managed"

# strata-client and strata-pool are independent distributions; strata-notebook
# depends on neither. They are workspace members only so `uv sync` installs
# them editable for the combined test suite.
[tool.uv.workspace]
members = ["packages/strata-client", "packages/strata-pool"]

[tool.uv.sources]
strata-client = { workspace = true }
strata-pool = { workspace = true }

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "src"
module-name = "strata._strata_core"
features = ["pyo3/extension-module"]
# The bundled frontend is not Python, so include it explicitly. Release CI
# copies frontend/dist/ to src/strata/_frontend/ before building.
include = [
    { path = "src/strata/_frontend/**/*", format = ["sdist", "wheel"] },
    # Coding-agent skill, discovered from `<site-packages>/strata/.agents/skills/`.
    { path = "src/strata/.agents/skills/**/*", format = ["sdist", "wheel"] },
    # Maturin's sdist is rooted at ``rust/``. Without these, ``License-File:
    # LICENSE`` points at a missing file and PyPI rejects the upload.
    { path = "LICENSE", format = ["sdist"] },
    { path = "README.md", format = ["sdist"] },
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/", "experiments/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ty.environment]
python-version = "3.12"
python = ".venv"

# Type-check only shipped code, which must stay clean. Examples/experiments are
# notebook cells whose variables the harness injects, and tests rely on stubs
# and fixture injection; ty can model neither.
[tool.ty.src]
include = ["src", "packages/strata-client/src", "packages/strata-pool/src"]

[tool.ty.rules]
# Optional deps (Rust ext, ADBC drivers) use guarded imports
unresolved-import = "warn"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests can import the non-packaged `evals` suite
# (the shipped package `strata` is imported from the installed venv, not here).
pythonpath = ["."]
# A deadlocked test fails after 3 min with a thread-stack dump that
# pinpoints the culprit, instead of hanging CI to GitHub's 6h cap (the slowest
# real test takes ~26s). "thread" is required because the hangs are off the
# main thread, where SIGALRM cannot reach. Override with @pytest.mark.timeout(N).
timeout = 180
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
    "warm_pool: marks tests that require live warm worker startup",
    "locked_environments: lets remote workers build the notebook's locked environment",
]

# Coverage is opt-in: pass ``--cov`` (or ``--cov=strata --cov-report=html``).
[tool.coverage.run]
source_pkgs = ["strata"]
branch = true
# Set true (per-process data files for ``coverage combine``) once subprocess
# coverage is wired in.
parallel = false
omit = [
    # Rust extension: imported, never executed from Python.
    "*/strata/_strata_core/*",
    # Re-export shim only.
    "*/strata/__init__.py",
]

[tool.coverage.report]
# ``exclude_also`` keeps coverage.py's built-in exclusions instead of replacing them.
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing\\.TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    # Optional-import fallbacks: the never-installed leg is not a coverage gap.
    "except ImportError:",
    "except ModuleNotFoundError:",
]
show_missing = true
skip_covered = false
precision = 1

[tool.coverage.html]
directory = "htmlcov"
