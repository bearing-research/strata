[project]
name = "strata-client"
version = "0.9.0"
description = "Lightweight Python client for Strata: materialize, persist, and query artifacts over HTTP."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# A copy of the repository root LICENSE: build backends only take files inside the project.
license-files = ["LICENSE"]
authors = [{ name = "Fangchen Li", email = "fangchen.li@outlook.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.28.0",
    "pyarrow>=18.0.0",
]

# Optional engine integrations; each pulls only its own engine. The arrow one
# needs only pyarrow, already a base dependency.
[project.optional-dependencies]
duckdb = ["duckdb>=1.5.0"]
pandas = ["pandas>=2.0.0"]
polars = ["polars>=1.36.1"]
datafusion = ["datafusion>=50.1.0"]
all = ["duckdb>=1.5.0", "pandas>=2.0.0", "polars>=1.36.1", "datafusion>=50.1.0"]

[project.urls]
Homepage = "https://github.com/bearing-research/strata"
Repository = "https://github.com/bearing-research/strata"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_client"]

[tool.hatch.build.targets.sdist]
include = ["src/strata_client", "README.md", "LICENSE"]
