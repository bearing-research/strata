[project]
name = "strata-pool"
version = "0.9.0"
description = "Worker pool for dispatching Strata jobs to ephemeral machines."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# A copy of the repository root LICENSE: build backends only take files inside the project.
license-files = ["LICENSE"]
authors = [{ name = "Fangchen Li", email = "fangchen.li@outlook.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Persistence is stdlib sqlite3, or Postgres via the extra below. Cloud SDKs
# stay optional extras of the backends that need them, never base dependencies.
dependencies = [
    "httpx>=0.28.0",
]

# Running the pool as a service. Optional so embedding the pool as a library
# never pulls in a web framework.
[project.optional-dependencies]
server = [
    "fastapi>=0.115.0",
    # Imported directly by the API (the machine-type catalogue), not only through FastAPI.
    "pydantic>=2.13.5",
    # FastAPI only asks for starlette>=0.46.0; 1.3.1 fixes the 2026 advisories.
    "starlette>=1.3.1",
    "uvicorn>=0.30.0",
]
# A store several pool processes can share (PostgresPoolStore).
postgres = [
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/bearing-research/strata"
Repository = "https://github.com/bearing-research/strata"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strata_pool"]

[tool.hatch.build.targets.sdist]
include = ["src/strata_pool", "README.md", "LICENSE"]

# pytest stops at the first pyproject.toml with a pytest section, so
# `pytest packages/strata-pool/tests` reads asyncio mode from here.
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "docker: needs a reachable Docker daemon (skipped automatically without one)",
    "runpod: starts a billed RunPod pod; opt-in only, never in CI",
    "fly: starts a billed Fly machine; opt-in only, never in CI",
]
