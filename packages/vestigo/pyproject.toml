[project]
name = "vestigo"
version = "0.11.0"
description = "The ledger of the shared computation substrate: versioned artifacts, builds and their leases, references, retention, on SQLite or PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Fangchen Li", email = "fangchen.li@outlook.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Metadata is stdlib sqlite3, or PostgreSQL via the extra below. Blobs are local
# files, or an object store through its own SDK, each the extra of its backend.
dependencies = []

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
s3 = [
    "boto3>=1.35.0",
]
gcs = [
    "google-cloud-storage>=3.0.0",
]
azure = [
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.25.3",
]

[project.urls]
Homepage = "https://github.com/bearing-research/vestigo"
Repository = "https://github.com/bearing-research/vestigo"
Changelog = "https://github.com/bearing-research/vestigo/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    # The Postgres suite starts a container and drives the store off the loop.
    "testcontainers>=4.15.0",
    "docker>=7.0.0",
    "anyio>=4.0.0",
    # The presigned-signing tests mint an RSA key.
    "cryptography>=42.0.0",
    # The suite's payloads are Arrow IPC streams; the package itself never reads them.
    "pyarrow>=18.0.0",
    # The S3 backend's unit tests run over moto's in-process S3.
    "moto[s3]>=5.0.0",
    # The same ruff as .pre-commit-config.yaml and ci.yml.
    "ruff==0.17.2",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 180
timeout_method = "thread"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests requiring external services",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
