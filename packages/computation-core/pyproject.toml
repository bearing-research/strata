[project]
name = "computation-core"
version = "0.11.0"
description = "The ledger of the shared computation substrate: versioned artifacts, builds and their leases, references, retention, on SQLite or PostgreSQL."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# A copy of the repository root LICENSE: build backends only take files inside the project.
license-files = ["LICENSE"]
authors = [{ name = "Fangchen Li", email = "fangchen.li@outlook.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Metadata is stdlib sqlite3, or PostgreSQL via the extra below. Blobs read and
# write through pyarrow's filesystems; each cloud's SDK is an extra of its backend.
dependencies = [
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
s3 = [
    "botocore>=1.35.0",
]
gcs = [
    "google-cloud-storage>=3.0.0",
]
azure = [
    "azure-storage-blob>=12.20.0",
    "azure-identity>=1.25.3",
]

[project.urls]
Homepage = "https://github.com/bearing-research/strata"
Repository = "https://github.com/bearing-research/strata"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
