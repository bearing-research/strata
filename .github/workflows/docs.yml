name: Docs

# Versioned docs via mike:
#   * push to main     -> `mike deploy dev`, and `mike set-default dev` only
#                         until a `latest` alias exists (the tag path owns it).
#   * push of a v* tag -> `mike deploy <version> latest` + `mike set-default latest`.
# PRs only run `mkdocs build --strict` and never touch gh-pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # Included in a docs page via pymdownx.snippets; without this the
      # published page keeps serving the old README.
      - 'packages/*/README.md'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      # Included in a docs page via pymdownx.snippets; without this the
      # published page keeps serving the old README.
      - 'packages/*/README.md'

# Every push deploy (main and v* tags) shares one group: concurrent mike pushes
# to gh-pages are rejected non-fast-forward, and a release pushes the prep merge
# and the tag together. No cancelling there, so no docs update is dropped. PR
# builds get a per-ref group and cancel stale runs.
concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default (Scorecard Token-Permissions); the build job escalates
# to contents: write only because mike pushes the site to gh-pages.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # mike reads gh-pages and pushes back to it.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          save-cache: false

      - name: Install docs dependencies
        run: uv sync --group docs --no-install-project

      - name: Validate build (PRs)
        if: github.event_name == 'pull_request'
        run: uv run mkdocs build --strict

      - name: Configure git for mike
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy dev (push to main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Sets the root default to dev only until a `latest` alias exists;
        # after the first v* tag, the tag path's set-default owns it.
        run: |
          uv run mike deploy --push --update-aliases dev
          if ! uv run mike list 2>/dev/null | grep -qE '(^|[, ])latest($|[, ])'; then
            uv run mike set-default --push dev
          fi

      - name: Deploy release version (push of v* tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        # Strips the leading v (v0.2.0 -> 0.2.0); the full triple keeps patch
        # releases distinguishable.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest
