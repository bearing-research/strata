name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'

# A new push to a PR supersedes its running checks; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

      - name: Run frontend build
        run: npm run build
        working-directory: frontend

      - name: Run frontend format check
        run: npm run format:check
        working-directory: frontend

  # strata-client must install and pass its tests with only its own deps
  # (httpx + pyarrow), no server stack: the slim-install promise.
  client-only:
    name: strata-client (no server deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          save-cache: false

      - name: Create an isolated venv with ONLY the client
        run: |
          uv venv --python 3.12 .venv-client
          # The server (strata-notebook) is deliberately not installed.
          uv pip install --python .venv-client ./packages/strata-client pytest

      - name: Assert the server stack is absent
        run: |
          .venv-client/bin/python - <<'PY'
          import importlib.util
          for mod in ("strata", "pyiceberg", "fastapi", "uvicorn", "duckdb", "pydantic"):
              assert importlib.util.find_spec(mod) is None, f"{mod} unexpectedly installed"
          print("server stack absent: client install is slim")
          PY

      - name: Run client tests
        run: .venv-client/bin/python -m pytest packages/strata-client/tests/ -v

  # strata-pool is composed by the hosted proxy, never by the notebook. Testing
  # it with only its own deps makes this job fail the day the pool imports the
  # server.
  pool-only:
    name: strata-pool (no server deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The shared-store tests run against a real Postgres as well as SQLite.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pool
          POSTGRES_PASSWORD: pool
          POSTGRES_DB: pool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pool -d pool"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          save-cache: false

      - name: Create an isolated venv with ONLY the pool
        run: |
          uv venv --python 3.12 .venv-pool
          # strata-pool pulls httpx; persistence is stdlib sqlite3.
          uv pip install --python .venv-pool ./packages/strata-pool

      - name: Assert the base install carries no server of any kind
        run: |
          .venv-pool/bin/python - <<'PY'
          import importlib.util
          for mod in ("strata", "pyiceberg", "fastapi", "uvicorn", "duckdb", "pyarrow"):
              assert importlib.util.find_spec(mod) is None, f"{mod} unexpectedly installed"
          print("base install is httpx and stdlib: importing the pool drags in no framework")
          PY

      - name: Add the server extra and the test runner
        run: |
          uv pip install --python .venv-pool './packages/strata-pool[server,postgres]' pytest pytest-asyncio

      - name: Assert the Strata server stack is still absent
        run: |
          .venv-pool/bin/python - <<'PY'
          import importlib.util
          for mod in ("strata", "pyiceberg", "duckdb", "pyarrow"):
              assert importlib.util.find_spec(mod) is None, f"{mod} unexpectedly installed"
          print("server stack absent: the pool stands alone")
          PY

      - name: Run pool tests
        working-directory: packages/strata-pool
        # Each REQUIRE turns a missing dependency (Docker daemon, server,
        # Postgres) from a silent skip into a hard failure, so a green run
        # means the live tests actually ran.
        env:
          STRATA_POOL_REQUIRE_DOCKER: "1"
          STRATA_POOL_REQUIRE_SERVER: "1"
          STRATA_POOL_REQUIRE_POSTGRES: "1"
          STRATA_POOL_POSTGRES_DSN: postgresql://pool:pool@localhost:5432/pool
        run: ../../.venv-pool/bin/python -m pytest tests/ -v

  # ty exits non-zero on errors; the unresolved-import warnings configured for
  # guarded optional deps (torch/jax) do not fail the build.
  type-check:
    name: Type Check (ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          save-cache: false

      - name: Install dependencies and build Rust extension
        run: uv sync --python 3.12 --all-extras

      - name: Type-check shipped code
        run: uv run ty check

  # Fast unit tests on all platforms and Python versions. Windows skips the
  # notebook subsystem (subprocess/venv/warm-pool semantics diverge from POSIX).
  unit-tests:
    name: Unit Tests - Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Backstop for a deadlocked test, below GitHub's 6h cap; the per-test
    # pytest-timeout normally trips first and dumps the stack. 45, not 30: a
    # normal macOS run takes about 13 minutes and a congested runner crossed 30.
    # On main every cell records diffcone evidence, running the suite under a
    # tracer (1.5-4x slower), hence 90 there.
    timeout-minutes: ${{ github.event_name == 'push' && 90 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    env:
      RUSTUP_TOOLCHAIN: stable
      # The unit run, through diffcone in the steps below (Windows skips the
      # notebook subsystem).
      UNIT_TEST_ARGS: >-
        tests/
        --ignore=tests/test_e2e_artifacts.py
        --ignore=tests/test_lineage.py
        --ignore=tests/test_s3_integration.py
        --ignore=tests/test_presigned_urls_minio.py
        --ignore=tests/test_presigned_urls_azurite.py
        --ignore=tests/test_lake_catalogs_integration.py
        --ignore=tests/test_artifact_store_postgres.py
        --ignore=tests/test_migrate_to_postgres.py
        --ignore=tests/notebook/test_e2e_mounts_s3.py
        --ignore=tests/notebook/test_e2e_mounts_azure.py
        --ignore=tests/notebook/test_e2e_mounts_gcs.py
        --ignore=tests/notebook/test_e2e_duckdb_lake.py
        -n auto --dist loadscope --tb=short
      WINDOWS_UNIT_TEST_ARGS: >-
        tests/
        --ignore=tests/test_e2e_artifacts.py
        --ignore=tests/test_lineage.py
        --ignore=tests/test_s3_integration.py
        --ignore=tests/test_presigned_urls_minio.py
        --ignore=tests/test_presigned_urls_azurite.py
        --ignore=tests/test_lake_catalogs_integration.py
        --ignore=tests/test_artifact_store_postgres.py
        --ignore=tests/test_migrate_to_postgres.py
        --ignore=tests/notebook
        -n auto --dist loadscope --tb=short

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # macOS images ship Homebrew's rust + rustup (RUSTUP_HOME under
      # /opt/homebrew). setup-rust-toolchain then skips installing rustup and
      # does not put ~/.cargo/bin on PATH, so the toolchain lands in ~/.rustup
      # while cargo still reads Homebrew's home and maturin's cargo-metadata
      # call fails. Removing Homebrew's rust forces the action's curl install.
      - name: Remove Homebrew rust on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --formula 2>/dev/null | grep -E '^(rust|rustup-init|rustup)$' \
            | xargs -I {} brew uninstall --force --ignore-dependencies {} \
            || true
          rm -rf /opt/homebrew/etc/.rustup
          which rustup 2>/dev/null || echo "rustup removed"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          # Every job on one OS computes the same uv cache key, so concurrent
          # savers warned "Unable to reserve cache". One saver per OS: this job
          # on 3.13 (--all-extras, a superset). Every other setup-uv restores only.
          save-cache: ${{ matrix.python-version == '3.13' }}

      - name: Install dependencies and build Rust extension
        shell: bash
        run: uv sync --python ${{ matrix.python-version }} --all-extras

      # diffcone (https://github.com/bearing-research/diffcone). On main this
      # is the full run, recorded per cell: each push's own change is planned
      # from the previous recording and checked against this run, and a new
      # failure the plan did not select (and that fails again when re-run)
      # fails the job. On pull requests only the tests the change can affect
      # run, planned from main's newest recording of the same cell.
      - name: Run unit tests and record (diffcone, main)
        id: record
        if: github.event_name == 'push'
        uses: bearing-research/diffcone/actions/record@d1bdc2ee155b801c8f4d83618246aa0b91a69093  # v0.2.0
        with:
          key-prefix: diffcone-unit-${{ matrix.os }}-py${{ matrix.python-version }}
          command: uv run pytest
          pytest-args: ${{ runner.os == 'Windows' && env.WINDOWS_UNIT_TEST_ARGS || env.UNIT_TEST_ARGS }}
          source-roots: src packages/strata-client/src packages/strata-pool/src tests=tests evals=evals
          check: true
          fail-on-test-failure: true

      - name: Run the affected unit tests (diffcone, pull request)
        if: github.event_name == 'pull_request'
        uses: bearing-research/diffcone/actions/run@d1bdc2ee155b801c8f4d83618246aa0b91a69093  # v0.2.0
        with:
          key-prefix: diffcone-unit-${{ matrix.os }}-py${{ matrix.python-version }}
          command: uv run pytest
          pytest-args: ${{ runner.os == 'Windows' && env.WINDOWS_UNIT_TEST_ARGS || env.UNIT_TEST_ARGS }}
          source-roots: src packages/strata-client/src packages/strata-pool/src tests=tests evals=evals

      - name: Upload the diffcone plan and verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diffcone-unit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: ${{ steps.record.outputs.results || 'diffcone-results' }}
          if-no-files-found: ignore

      # Needs root and a second OS user, which the suite cannot arrange: a cell
      # run as the harness user must not read the server's environment through
      # /proc. That user must reach the venv's interpreter and the checkout, so
      # every directory on both paths gets o+x.
      - name: Harness-user isolation (Linux, root)
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        shell: bash
        run: |
          sudo useradd --create-home strata-cells
          for target in "$(readlink -f .venv/bin/python)" "$PWD/src"; do
            d="$target"
            while [ "$d" != "/" ]; do sudo chmod o+rx "$d"; d="$(dirname "$d")"; done
          done
          set -o pipefail
          sudo env "PATH=$PATH" STRATA_TEST_HARNESS_USER=strata-cells \
            .venv/bin/python -m pytest tests/test_harness_isolation.py \
            -k cannot_read_the_servers_environment \
            -p no:cacheprovider --basetemp=/tmp/strata-harness-e2e -v | tee harness-e2e.log
          # A skip passes pytest; here it would mean nothing was checked.
          grep -q " 1 passed" harness-e2e.log

  # E2E and integration tests, Ubuntu only for speed.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'push' && 45 || 15 }}
    env:
      E2E_TEST_ARGS: >-
        tests/test_e2e_artifacts.py tests/test_lineage.py tests/test_executor_protocol.py
        -v --tb=short

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Verify Rust toolchain
        # macOS runners sometimes leave the rustup proxy half-configured, and
        # cargo from a child shell (maturin under uv sync) resolves to
        # rustup-init ("unexpected argument 'metadata'"). Setting the default
        # fixes dispatch and fails fast with diagnostics if it is still broken.
        shell: bash
        run: |
          rustup default stable
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          save-cache: false

      - name: Install dependencies and build Rust extension
        run: uv sync --python 3.12 --all-extras

      # diffcone, as in the unit tests: the full run recorded and checked on
      # main, the affected tests on pull requests.
      - name: Run E2E tests and record (diffcone, main)
        id: record
        if: github.event_name == 'push'
        uses: bearing-research/diffcone/actions/record@d1bdc2ee155b801c8f4d83618246aa0b91a69093  # v0.2.0
        with:
          key-prefix: diffcone-e2e
          command: uv run pytest
          pytest-args: ${{ env.E2E_TEST_ARGS }}
          source-roots: src packages/strata-client/src packages/strata-pool/src tests=tests evals=evals
          check: true
          fail-on-test-failure: true

      - name: Run the affected E2E tests (diffcone, pull request)
        if: github.event_name == 'pull_request'
        uses: bearing-research/diffcone/actions/run@d1bdc2ee155b801c8f4d83618246aa0b91a69093  # v0.2.0
        with:
          key-prefix: diffcone-e2e
          command: uv run pytest
          pytest-args: ${{ env.E2E_TEST_ARGS }}
          source-roots: src packages/strata-client/src packages/strata-pool/src tests=tests evals=evals

      - name: Upload the diffcone plan and verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diffcone-e2e
          path: ${{ steps.record.outputs.results || 'diffcone-results' }}
          if-no-files-found: ignore

  # R-cell tests in their own job: R does not care about the Python version,
  # so installing it in the unit-tests matrix only multiplies the cost.
  # Ubuntu + macOS only; Windows already skips notebook tests.
  r-tests:
    name: R Tests (${{ matrix.os }} · R ${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ github.event_name == 'push' && 60 || 20 }}
    strategy:
      fail-fast: false
      # Current R on both platforms plus the previous minor ("oldrel-1") on
      # Ubuntu, so an R-version regression surfaces without doubling the
      # matrix. RSPM serves binaries for both, so arrow is not compiled.
      matrix:
        include:
          - os: ubuntu-latest
            r: release
          - os: macos-latest
            r: release
          - os: ubuntu-latest
            r: oldrel-1

    env:
      RUSTUP_TOOLCHAIN: stable
      R_TEST_ARGS: >-
        tests/notebook/test_r_cells.py
        tests/notebook/test_language_r_executor.py
        tests/notebook/test_language_r_analyzer.py
        tests/notebook/test_shared_renv.py
        tests/notebook/test_r_workers.py
        -v --tb=short

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same Homebrew rust eviction as the unit-tests job.
      - name: Remove Homebrew rust on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list --formula 2>/dev/null | grep -E '^(rust|rustup-init|rustup)$' \
            | xargs -I {} brew uninstall --force --ignore-dependencies {} \
            || true
          rm -rf /opt/homebrew/etc/.rustup
          which rustup 2>/dev/null || echo "rustup removed"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          save-cache: false

      - name: Install dependencies and build Rust extension
        run: uv sync --python 3.12 --all-extras

      # use-public-rspm points install.packages() at posit's prebuilt Linux
      # binaries (arrow takes ~30s instead of a ~10-min compile).
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      # Direct install: setup-r-dependencies wants a DESCRIPTION or renv.lock
      # at the project root, which Strata does not have. jsonlite is the
      # harness's manifest codec, arrow serializes data.frames in the
      # cross-language tests, and renv pre-installed keeps the real-restore
      # test from bootstrap-downloading it mid-test.
      - name: Install R 'jsonlite' + 'arrow' + 'renv' packages
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite", "arrow", "renv"))
          for (pkg in c("jsonlite", "arrow", "renv")) {
            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop(sprintf("'%s' install reported success but namespace is not loadable", pkg))
            }
          }

      # Only the R-marked tier the unit-tests matrix skips for lack of Rscript.
      # The R version is recorded with the evidence and checked, so a newer R
      # than the recording's runs everything.
      - name: The R version, for diffcone
        shell: bash
        run: echo "R_VERSION=$(Rscript -e 'cat(R.version.string)')" >> "$GITHUB_ENV"

      - name: Run R tests and record (diffcone, main)
        id: record
        if: github.event_name == 'push'
        uses: bearing-research/diffcone/actions/record@d1bdc2ee155b801c8f4d83618246aa0b91a69093  # v0.2.0
        with:
          key-prefix: diffcone-r-${{ matrix.os }}-${{ matrix.r }}
          command: uv run pytest
          pytest-args: ${{ env.R_TEST_ARGS }}
          env-vars: R_VERSION
          source-roots: src packages/strata-client/src packages/strata-pool/src tests=tests evals=evals
          check: true
          fail-on-test-failure: true

      - name: Run the affected R tests (diffcone, pull request)
        if: github.event_name == 'pull_request'
        uses: bearing-research/diffcone/actions/run@d1bdc2ee155b801c8f4d83618246aa0b91a69093  # v0.2.0
        with:
          key-prefix: diffcone-r-${{ matrix.os }}-${{ matrix.r }}
          command: uv run pytest
          pytest-args: ${{ env.R_TEST_ARGS }}
          source-roots: src packages/strata-client/src packages/strata-pool/src tests=tests evals=evals

      - name: Upload the diffcone plan and verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: diffcone-r-${{ matrix.os }}-${{ matrix.r }}
          path: ${{ steps.record.outputs.results || 'diffcone-results' }}
          if-no-files-found: ignore

  notebook-browser-smoke:
    name: Notebook Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Verify Rust toolchain
        # macOS runners sometimes leave the rustup proxy half-configured, and
        # cargo from a child shell (maturin under uv sync) resolves to
        # rustup-init ("unexpected argument 'metadata'"). Setting the default
        # fixes dispatch and fails fast with diagnostics if it is still broken.
        shell: bash
        run: |
          rustup default stable
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          save-cache: false

      - name: Install backend dependencies and build Rust extension
        run: uv sync --python 3.12 --all-extras

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # No --with-deps: the runner image ships Google Chrome, so Chromium's
      # system libraries are there, and that apt-get update once hung 28 minutes.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
        working-directory: frontend

      - name: Start Strata notebook server
        run: |
          STRATA_DEPLOYMENT_MODE=personal STRATA_PORT=8770 STRATA_NOTEBOOK_STORAGE_DIR=/tmp uv run strata-notebook > /tmp/strata-ci.log 2>&1 &
          echo $! > /tmp/strata-ci.pid

      - name: Wait for notebook server health
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8770/health"
          deadline = time.time() + 60
          last_error = None

          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception as exc:  # pragma: no cover - CI shell helper
                  last_error = exc
                  time.sleep(1)

          raise SystemExit(f"Notebook server did not become healthy: {last_error}")
          PY

      - name: Run notebook browser benchmark smoke
        run: npm run benchmark:notebook -- --base-url http://127.0.0.1:8770 --iterations 1
        working-directory: frontend

      - name: Run embeddable app-view browser smoke
        run: npm run embed:smoke -- --base-url http://127.0.0.1:8770 --parent-path /tmp
        working-directory: frontend

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/strata-ci.log

      - name: Stop notebook server
        if: always()
        run: |
          if [ -f /tmp/strata-ci.pid ]; then
            kill "$(cat /tmp/strata-ci.pid)" || true
          fi
