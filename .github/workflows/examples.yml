name: Examples

# Runs the key-free notebook examples end-to-end via `strata run`, catching a
# real notebook broken by a change the unit tests miss. Excluded:
#   - review_triage, news_alpha_trader: need API keys
#   - arxiv_classifier: needs remote workers (Modal, Fly)
#   - library_cells: fails on purpose (the `blocked` cell), which the
#     headless runner cannot tell from a real failure

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'rust/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'uv.lock'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'rust/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'uv.lock'
      - '.github/workflows/examples.yml'

# A new push to a PR supersedes its running checks; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job: per-example jobs each paid a minute of setup for seconds of run.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXAMPLES: >-
        agent_demo
        iris_classification
        pandas_basics
        loop_hill_climb
        markdown_showcase
        titanic_ml
        sql_orders_report
        s3_mount
        r_mtcars_analysis
        r_lm_vs_sklearn

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Verify Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          version: 'latest'
          # Restore only; ci.yml's unit-tests saves this cache (see there).
          save-cache: false

      # The R examples need Rscript. use-public-rspm pulls binary packages on
      # Ubuntu, turning a ~10-min source compile of arrow into a ~30s download.
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with:
          r-version: "release"
          use-public-rspm: true

      # Harness baseline (jsonlite + arrow) plus renv: `strata run` restores
      # each R notebook's renv.lock itself.
      - name: Install R 'jsonlite' + 'arrow' + 'renv' packages
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite", "arrow", "renv"))
          for (pkg in c("jsonlite", "arrow", "renv")) {
            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop(sprintf("'%s' install reported success but namespace is not loadable", pkg))
            }
          }

      - name: Build Strata (and the Rust extension)
        run: uv sync --all-extras

      # Every example runs even after one fails (a flaky public S3 read must
      # not hide a real failure elsewhere). uv sync installs the interpreter
      # each example's requires-python names; --force ignores the cache so a
      # previous run's artifacts cannot mask a cell-execution regression.
      - name: Run every example
        shell: bash
        # UV_PYTHON (from setup-uv) would override each example's own pin.
        env:
          UV_PYTHON: ""
        run: |
          failed=()
          for example in $EXAMPLES; do
            echo "::group::$example"
            if (cd "examples/$example" && uv sync) \
              && timeout 10m uv run strata run "examples/$example" --no-sync --force; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::example $example failed"
              failed+=("$example")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed examples: ${failed[*]}"
            exit 1
          fi
