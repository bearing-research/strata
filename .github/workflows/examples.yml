name: Examples

# Runs the key-free notebook examples end-to-end via `strata run`, catching a
# real notebook broken by a change the unit tests miss. Excluded:
#   - review_triage, news_alpha_trader: need API keys
#   - arxiv_classifier: needs remote workers (Modal, Fly)
#   - library_cells: fails on purpose (the `blocked` cell), which the
#     headless runner cannot tell from a real failure

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'rust/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'uv.lock'
      - '.github/workflows/examples.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'rust/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'uv.lock'
      - '.github/workflows/examples.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  examples:
    name: example · ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      # A flaky public S3 read must not hide a real failure elsewhere.
      fail-fast: false
      matrix:
        example:
          - agent_demo
          - iris_classification
          - pandas_basics
          - loop_hill_climb
          - markdown_showcase
          - titanic_ml
          - sql_orders_report
          - s3_mount

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Verify Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 'latest'
          # Restore only; ci.yml's unit-tests saves this cache (see there).
          save-cache: false

      - name: Build Strata (and the Rust extension)
        run: uv sync --python 3.13 --all-extras

      - name: Sync the example's per-notebook venv
        # uv sync installs the interpreter that each example's
        # requires-python names, so bumping one needs no workflow edit.
        working-directory: examples/${{ matrix.example }}
        run: uv sync

      # --force ignores the cache so a previous run's artifacts cannot mask
      # a cell-execution regression.
      - name: Run notebook
        run: uv run strata run examples/${{ matrix.example }} --no-sync --force

  # R-cell examples need Rscript on top of the Python build. `strata run`
  # restores each notebook's renv.lock itself, so only the harness baseline
  # (jsonlite + arrow) and renv are pre-installed.
  r-examples:
    name: example · ${{ matrix.example }} (R)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - r_mtcars_analysis
          - r_lm_vs_sklearn

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Verify Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: 'latest'
          # Restore only; ci.yml's unit-tests saves this cache (see there).
          save-cache: false

      # use-public-rspm pulls binary packages on Ubuntu, turning a
      # ~10-min source compile of arrow into a ~30s download.
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2
        with:
          r-version: "release"
          use-public-rspm: true

      # Harness baseline (jsonlite + arrow) plus renv, which the
      # notebook's auto-restore uses to install the rest from renv.lock.
      - name: Install R 'jsonlite' + 'arrow' + 'renv' packages
        shell: Rscript {0}
        run: |
          install.packages(c("jsonlite", "arrow", "renv"))
          for (pkg in c("jsonlite", "arrow", "renv")) {
            if (!requireNamespace(pkg, quietly = TRUE)) {
              stop(sprintf("'%s' install reported success but namespace is not loadable", pkg))
            }
          }

      - name: Build Strata (and the Rust extension)
        run: uv sync --python 3.13 --all-extras

      - name: Sync the example's per-notebook venv
        working-directory: examples/${{ matrix.example }}
        run: uv sync

      # `strata run` still restores the notebook's renv.lock before the R cells.
      - name: Run notebook
        run: uv run strata run examples/${{ matrix.example }} --no-sync --force
