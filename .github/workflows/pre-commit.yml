name: Pre-commit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "26"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # What pre-commit/action did, inlined: its latest release (v3.0.1) still
      # caches with actions/cache@v4, which targets the deprecated Node 20. And
      # pre-commit comes from uv.lock (the dev group), hash-pinned, not an
      # unpinned pip install.
      - name: Install pre-commit
        run: uv sync --frozen --only-group dev --no-install-project

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run --no-sync pre-commit run --show-diff-on-failure --color=always --all-files

      # A pyproject.toml edit that leaves uv.lock behind (as Dependabot's pip
      # updater did) can otherwise merge green with a lockfile below a raised
      # lower bound. Nothing else in CI reads the lock strictly.
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
