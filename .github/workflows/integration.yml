name: Integration Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'

# A new push to a PR supersedes its running checks; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  STRATA_CATALOG_URI: postgresql://strata:strata@localhost:5432/iceberg_catalog

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: strata
          POSTGRES_PASSWORD: strata
          POSTGRES_DB: iceberg_catalog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U strata -d iceberg_catalog"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          version: "latest"
          save-cache: false

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run integration tests
        run: uv run python scripts/integration_test.py --start-server

      - name: Run Postgres-backed artifact store tests
        run: |
          uv run pytest \
            packages/vestigo/tests/test_artifact_store_postgres.py \
            tests/test_postgres_store_strata.py \
            tests/test_migrate_to_postgres.py \
            tests/notebook/test_local_runs_postgres.py \
            -v --tb=short -p no:cacheprovider

      - name: Run emulator-backed mount integration tests
        run: |
          set -o pipefail
          uv run pytest \
            tests/notebook/test_e2e_mounts_s3.py \
            tests/notebook/test_e2e_mounts_azure.py \
            tests/notebook/test_e2e_mounts_gcs.py \
            tests/test_presigned_urls_minio.py \
            tests/test_presigned_urls_azurite.py \
            tests/test_lake_catalogs_integration.py \
            tests/notebook/test_e2e_duckdb_lake.py \
            tests/test_s3_integration.py \
            -v --tb=short -p no:cacheprovider | tee emulator-tests.log
          # The lake-catalog tests skip as a module without a Docker daemon; a
          # skip passes pytest, and here it would mean the real writers' deletes
          # were never checked.
          grep -q "test_lake_catalogs_integration.py::.* PASSED" emulator-tests.log
