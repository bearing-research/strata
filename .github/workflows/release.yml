name: Release

# A `v*` tag builds the frontend, the platform wheels (abi3-py312: one per
# platform) and an sdist, publishes to TestPyPI via OIDC trusted publishing,
# then to PyPI after manual approval on the protected `pypi` environment.
#
# Trusted publishers must exist on PyPI and TestPyPI (Owner: bearing-research,
# Repo: strata, Workflow: release.yml, Environment: testpypi / pypi).

on:
  push:
    tags:
      - 'v*'
  # Re-publish without re-tagging after a transient publish failure. The
  # version input lets pre-flight still check version consistency.
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.2.0). Required on manual runs."
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: '26'
  # Opt in to Node 24 for JS actions ahead of GitHub's Node 20 removal.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # --- pre-flight ----------------------------------------------------
  # Fails before any wheel build if the tag disagrees with the pyproject
  # versions or CHANGELOG.md has no section for this version. maturin builds
  # whatever pyproject.toml says, regardless of the tag.
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_prerelease: ${{ steps.resolve.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A dispatch run would otherwise build the dispatching branch, which
          # may have moved past the tag; rebuild the tagged source instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}


      - name: Resolve version + run checks
        id: resolve
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import sys
          import tomllib

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              version = os.environ["DISPATCH_VERSION"]
          else:
              version = os.environ["GITHUB_REF_NAME"].lstrip("v")

          with open("pyproject.toml", "rb") as f:
              pyproject_version = tomllib.load(f)["project"]["version"]
          if pyproject_version != version:
              print(
                  f"::error::Release tag/input {version!r} doesn't match "
                  f"pyproject.toml version {pyproject_version!r}. "
                  "Run ``uv version`` to align them.",
                  file=sys.stderr,
              )
              sys.exit(1)

          # strata-client ships from the same tag and must stay in lockstep.
          with open("packages/strata-client/pyproject.toml", "rb") as f:
              client_version = tomllib.load(f)["project"]["version"]
          if client_version != version:
              print(
                  f"::error::strata-client version {client_version!r} doesn't match the "
                  f"release version {version!r}. Keep packages/strata-client/pyproject.toml "
                  "in lockstep with the root pyproject.toml.",
                  file=sys.stderr,
              )
              sys.exit(1)

          # strata-pool too: it runs alongside a server, so matching versions
          # are the useful ones. This check guarantees a tag never publishes a
          # version PyPI has seen, which lets the PyPI job use skip-existing.
          with open("packages/strata-pool/pyproject.toml", "rb") as f:
              pool_version = tomllib.load(f)["project"]["version"]
          if pool_version != version:
              print(
                  f"::error::strata-pool version {pool_version!r} doesn't match the "
                  f"release version {version!r}. Keep packages/strata-pool/pyproject.toml "
                  "in lockstep with the root pyproject.toml.",
                  file=sys.stderr,
              )
              sys.exit(1)

          changelog = open("CHANGELOG.md").read()
          if not re.search(rf"^##\s+{re.escape(version)}(?:\s|$)", changelog, re.MULTILINE):
              print(
                  f"::error::CHANGELOG.md has no '## {version}' section heading.",
                  file=sys.stderr,
              )
              sys.exit(1)

          # PEP 440 stable releases are digit-and-dot only; anything else
          # (a / b / rc / dev / post) is a pre-release for GitHub Releases.
          is_prerelease = "false" if re.fullmatch(r"[0-9.]+", version) else "true"
          print(f"version={version}")
          print(f"is_prerelease={is_prerelease}")
          PY

  # --- frontend bundling ---------------------------------------------
  # Built once and shared as an artifact; each wheel job stages it into
  # src/strata/_frontend before maturin runs.
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A dispatch run would otherwise build the dispatching branch, which
          # may have moved past the tag; rebuild the tagged source instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}


      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # --- linux wheels (x86_64 + aarch64) -------------------------------
  linux:
    name: wheel · linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A dispatch run would otherwise build the dispatching branch, which
          # may have moved past the tag; rebuild the tagged source instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}


      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-dist
          path: src/strata/_frontend

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          target: ${{ matrix.target }}
          # Linux x86_64 also builds the one sdist.
          args: >-
            --release --out dist
            ${{ matrix.target == 'x86_64' && '--sdist' || '' }}
          sccache: 'true'
          manylinux: auto

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # --- macos wheels (intel + apple silicon) --------------------------
  macos:
    name: wheel · macos ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 30
    needs: frontend
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A dispatch run would otherwise build the dispatching branch, which
          # may have moved past the tag; rebuild the tagged source instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}


      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-dist
          path: src/strata/_frontend

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # --- windows wheels ------------------------------------------------
  windows:
    name: wheel · windows ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 45
    needs: frontend
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A dispatch run would otherwise build the dispatching branch, which
          # may have moved past the tag; rebuild the tagged source instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}


      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: frontend-dist
          path: src/strata/_frontend

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-windows-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  # --- strata-client wheel (pure-Python, independent distribution) ---
  # One py3-none-any wheel + sdist, no frontend or Rust. Uploaded as a dist-*
  # artifact so the publish jobs pick it up by pattern.
  client-wheel:
    name: wheel · strata-client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          version: "latest"

      - name: Build the strata-client wheel + sdist
        run: uv build --package strata-client --out-dir dist

      - name: Smoke-test the strata-client wheel
        # Standalone install (no server deps), so a broken client wheel fails
        # here and not on a user's machine.
        run: |
          set -euo pipefail
          CLIENT_WHEEL=$(ls dist/strata_client-*-py3-none-any.whl | head -1)
          echo "::notice::Testing client wheel ${CLIENT_WHEEL}"
          uv venv /tmp/client-smoke
          VIRTUAL_ENV=/tmp/client-smoke uv pip install \
            --index https://pypi.org/simple/ "${CLIENT_WHEEL}"
          /tmp/client-smoke/bin/python -c "
          from strata_client import StrataClient, AsyncStrataClient
          from strata_client.filters import Filter, FilterOp
          print('strata_client imports ok')
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-client
          path: dist
          if-no-files-found: error

  # --- strata-pool wheel (pure-Python, independent distribution) ------
  # Same shape as client-wheel.
  pool-wheel:
    name: wheel · strata-pool
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.12"
          version: "latest"

      - name: Build the strata-pool wheel + sdist
        run: uv build --package strata-pool --out-dir dist

      - name: Smoke-test the strata-pool wheel
        # Proves the wheel imports and that the base install stays slim:
        # __init__ imports both backends eagerly, so an SDK promoted out of its
        # extra would still import fine. Only asserting its absence catches it.
        run: |
          set -euo pipefail
          POOL_WHEEL=$(ls dist/strata_pool-*-py3-none-any.whl | head -1)
          echo "::notice::Testing pool wheel ${POOL_WHEEL}"
          uv venv /tmp/pool-smoke
          VIRTUAL_ENV=/tmp/pool-smoke uv pip install \
            --index https://pypi.org/simple/ "${POOL_WHEEL}"
          /tmp/pool-smoke/bin/python -c "
          import importlib.util, sys
          from strata_pool import Pool, PoolStore, Backend, DockerBackend, RunPodBackend
          from strata_pool import Job, JobState, MachineType, UsageEvent, Worker, WorkerState
          for sdk in ('docker', 'fastapi', 'uvicorn'):
              if importlib.util.find_spec(sdk) is not None:
                  sys.exit(f'{sdk} reached the base install; it belongs in an extra')
          print('strata_pool imports ok, base install stayed slim')
          "
          # The server extra is a documented install path, so it is built too.
          uv venv /tmp/pool-server-smoke
          VIRTUAL_ENV=/tmp/pool-server-smoke uv pip install \
            --index https://pypi.org/simple/ "${POOL_WHEEL}[server]"
          /tmp/pool-server-smoke/bin/python -c "
          from strata_pool.api import create_app
          print('strata_pool[server] imports ok')
          "

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist-pool
          path: dist
          if-no-files-found: error

  # --- wheel smoke test ----------------------------------------------
  # Installs the Linux x86_64 wheel in a fresh venv and checks imports,
  # console scripts, /health and the frontend bundle, so a missing dep,
  # broken entry point or unloadable extension fails before it takes a PyPI
  # version slot. The other wheels are cross-built and cannot run here; they
  # share the Python sources.
  wheel-test:
    name: Smoke-test linux x86_64 wheel · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [linux, macos, windows]
    strategy:
      # Checks the abi3-py312 claim (one wheel for every 3.12+) on each
      # interpreter, not just setup-uv's default.
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist-linux-x86_64
          path: dist

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Smoke-test the wheel
        env:
          STRATA_PORT: '8767'
          STRATA_NOTEBOOK_STORAGE_DIR: /tmp/strata-smoke-nb
        run: |
          set -euo pipefail

          WHEEL=$(ls dist/strata_notebook-*-cp312-abi3-manylinux*x86_64*.whl | head -1)
          echo "::notice::Testing wheel ${WHEEL}"

          # Strata's runtime guard requires a uv-managed venv (the `uv =`
          # marker in pyvenv.cfg).
          uv venv /tmp/strata-smoke
          VIRTUAL_ENV=/tmp/strata-smoke uv pip install \
            --index https://pypi.org/simple/ \
            "${WHEEL}"

          echo "--- import smoke ---"
          # The HTTP client ships in strata-client; this package exposes only
          # the wire/config surface.
          /tmp/strata-smoke/bin/python -c "
          import strata
          from strata import Filter, FilterOp, FilterValue, StrataConfig
          print('strata server package imports ok')
          "

          echo "--- console scripts ---"
          /tmp/strata-smoke/bin/strata --help >/dev/null
          /tmp/strata-smoke/bin/strata-worker --help >/dev/null
          echo "strata and strata-worker --help ok"

          echo "--- server boot + /health ---"
          /tmp/strata-smoke/bin/strata-notebook >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          # Poll /health for up to 30s: warmup in the lifespan handler can
          # delay binding on a cold runner.
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${STRATA_PORT}/health" >/dev/null 2>&1; then
              echo "::notice::server responded to /health after ${i}s"
              break
            fi
            sleep 1
          done
          # Once more, so the final response or error is in the log.
          curl -fsS "http://127.0.0.1:${STRATA_PORT}/health" || {
            echo "::error::server did not respond to /health within 30s"
            echo "--- server log ---"
            cat /tmp/server.log
            kill "${SERVER_PID}" 2>/dev/null || true
            exit 1
          }
          echo

          echo "--- GET / (frontend bundle present?) ---"
          # The server silently skips mounting a missing SPA bundle, so a
          # wheel without it would still pass /health.
          curl -fsS "http://127.0.0.1:${STRATA_PORT}/" -o /tmp/frontend.html
          if ! grep -qi '<!doctype html' /tmp/frontend.html; then
            echo "::error::GET / did not return the SPA index.html: frontend bundle missing from wheel"
            echo "--- response body (first 200 bytes) ---"
            head -c 200 /tmp/frontend.html
            kill "${SERVER_PID}" 2>/dev/null || true
            exit 1
          fi
          echo "::notice::frontend bundle served ($(wc -c < /tmp/frontend.html) bytes)"

          kill "${SERVER_PID}" 2>/dev/null || true
          wait "${SERVER_PID}" 2>/dev/null || true
          echo "::notice::wheel smoke test passed"

  # --- TestPyPI publish (auto on tag) --------------------------------
  testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [linux, macos, windows, client-wheel, pool-wheel, wheel-test]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/strata-notebook
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          # Merge every dist-* artifact into one dist/ for the publish action.
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Lets a workflow_dispatch re-run finish after a partial failure.
          skip-existing: true

  # --- PyPI publish (gated by manual approval) -----------------------
  # The `pypi` environment needs a required reviewer; this job waits for
  # "Approve and deploy" in the run UI.
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: testpypi
    environment:
      name: pypi
      url: https://pypi.org/p/strata-notebook
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          # Uploads are per file, and a failure part-way leaves the earlier
          # ones live; without this a retry 400s on them and never reaches the
          # package that failed. A tag still never republishes: pre-flight
          # fails the run when any package version disagrees with the tag.
          skip-existing: true

  # --- GitHub Release (release notes from CHANGELOG) -----------------
  # Only after the PyPI publish succeeds, so a Release never points at a tag
  # whose wheels are not on PyPI.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [preflight, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      # The only job that escalates, and only to the one scope creating a
      # Release needs. Scorecard flags any write; accepted, as there is no
      # narrower scope.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # A dispatch run would otherwise build the dispatching branch, which
          # may have moved past the tag; rebuild the tagged source instead.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}


      - name: Extract CHANGELOG section
        id: notes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md").read()
          # The version's heading (and any suffix, such as a date) up to the
          # next "## " heading or EOF. preflight already checked it exists.
          pattern = rf"^##\s+{re.escape(version)}(?:[\s-][^\n]*)?\n(.*?)(?=^##\s|\Z)"
          match = re.search(pattern, text, flags=re.DOTALL | re.MULTILINE)
          body = match.group(1).strip() if match else ""
          print("body<<NOTES_EOF")
          print(body)
          print("NOTES_EOF")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ needs.preflight.outputs.is_prerelease == 'true' }}
