name: Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
      - 'LICENSE'
      - '.github/workflows/docs.yml'

# A new push to a PR supersedes its running checks; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: strata:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name strata-test -p 8765:8765 \
            -e STRATA_MCP_ENABLED=true strata:test

      - name: Health check
        run: |
          # Poll /health for up to 30s: a fixed 10s sleep was flaky on cold
          # runners. --retry-connrefused retries while the listener binds.
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8765/health
        # The "if failure" step below dumps the container logs.

      - name: Container logs on failure
        if: failure()
        run: docker logs strata-test || true

      - name: Check metrics endpoint
        run: |
          curl -f http://localhost:8765/metrics

      - name: Check MCP endpoint
        run: |
          # The image ships the mcp extra. Without it /mcp is not mounted and
          # the SPA catch-all answers this POST with 405.
          out=$(curl -fsS -X POST http://localhost:8765/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}')
          grep -q '"serverInfo"' <<<"$out" || {
            echo "FAIL: /mcp did not answer initialize"; echo "$out"; exit 1;
          }

      - name: Stop container
        if: always()
        run: |
          docker stop strata-test || true
          docker rm strata-test || true

  worker:
    name: Build and test worker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Built from PyPI, as a pool runs it (the file uses nothing from the
      # build context). So this proves the published worker, not this branch's;
      # unreleased worker code is covered by the Python suite.
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: worker.Dockerfile
          push: false
          load: true
          tags: strata-worker:test
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      # The image's own claims, in the order it makes them.

      - name: It refuses to start without a token
        run: |
          # The image binds 0.0.0.0, so inheriting the library's auth-disabled
          # default would expose remote code execution. Nothing else covers this.
          if docker run --rm strata-worker:test 2>stderr.txt; then
            echo "FAIL: the worker started with no STRATA_WORKER_TOKEN"
            exit 1
          fi
          grep -q "refusing to start" stderr.txt || {
            echo "FAIL: exited without saying why"; cat stderr.txt; exit 1;
          }

      - name: It does not run as root
        run: |
          # Cells execute arbitrary user code.
          uid=$(docker run --rm strata-worker:test id -u)
          test "$uid" != "0" || { echo "FAIL: worker runs as root"; exit 1; }

      - name: It serves /health on 8080 with a token set
        run: |
          # 8080 because that is DockerBackend's default worker_port; the
          # worker's own default is 9000, so a drift here breaks dispatch.
          docker run -d --name strata-worker-test -p 8080:8080 \
            -e STRATA_WORKER_TOKEN=ci-test-token strata-worker:test
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused \
            --retry-all-errors http://localhost:8080/health

      - name: Worker logs on failure
        if: failure()
        run: docker logs strata-worker-test || true

      - name: Its execution endpoint requires the token
        run: |
          # /health is unauthenticated by design; /execute must not be.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8080/execute -d '{}')
          test "$code" = "401" || {
            echo "FAIL: /execute answered $code without a token, expected 401"
            exit 1
          }
          # With the token it gets past auth (400 on a junk manifest), so the
          # 401 above came from auth and not a missing endpoint.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer ci-test-token' \
            http://localhost:8080/execute -d '{}')
          test "$code" = "400" || {
            echo "FAIL: /execute answered $code with a valid token, expected 400"
            exit 1
          }

      - name: Stop worker
        if: always()
        run: |
          docker stop strata-worker-test || true
          docker rm strata-worker-test || true

      - name: Build the worker image with R
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: worker.Dockerfile
          build-args: WITH_R=true
          push: false
          load: true
          tags: strata-worker:r
          cache-from: type=gha,scope=worker-r
          cache-to: type=gha,mode=max,scope=worker-r

      - name: Its R runs harness.R's packages, still not as root
        run: |
          # harness.R loads jsonlite unconditionally and arrow for any data
          # frame; a worker without either accepts an R cell and fails it.
          # renv restores a notebook's renv.lock.
          docker run --rm strata-worker:r Rscript -e 'library(jsonlite); library(arrow); library(renv)'
          uid=$(docker run --rm strata-worker:r id -u)
          test "$uid" != "0" || { echo "FAIL: worker runs as root"; exit 1; }
