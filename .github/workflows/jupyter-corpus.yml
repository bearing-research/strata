name: Jupyter Corpus

# Runs the extended public .ipynb corpus (URLs pinned in
# tests/notebook/jupyter_corpus/extended.yaml) through the importer end to
# end; per-PR CI covers only the in-repo smoke corpus, as this needs network.
# Nightly and on demand (e.g. before a tag). Report-only: a flaky download or
# a renamed upstream notebook must not block merges. See the junit artifact.

on:
  schedule:
    # Outside the usual workday, so it does not compete with normal CI.
    - cron: '0 4 * * *'
  workflow_dispatch:

# Stale runs from yesterday's cron add no signal.
concurrency:
  group: jupyter-corpus
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus:
    name: Extended corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Report-only; the junit XML says which entries broke.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Verify Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          version: 'latest'
          save-cache: false

      - name: Build Strata (with notebook + Rust extension)
        run: uv sync --all-extras

      - name: Cache extended-corpus downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/strata-jupyter-corpus
          # The manifest pins commit SHAs, so its hash is a safe cache key.
          key: jupyter-corpus-${{ hashFiles('tests/notebook/jupyter_corpus/extended.yaml') }}

      - name: Run the extended corpus
        env:
          STRATA_CORPUS_RUN: '1'
        run: |
          uv run pytest \
            tests/notebook/test_jupyter_corpus.py::test_corpus_extended \
            -v \
            --junitxml=junit-corpus.xml \
            || true

      - name: Run the smoke corpus in full mode too
        env:
          STRATA_CORPUS_RUN: '1'
        run: |
          uv run pytest \
            tests/notebook/test_jupyter_corpus.py::test_corpus_smoke_full_run \
            -v \
            --junitxml=junit-smoke-full.xml \
            || true

      - name: Upload junit XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: jupyter-corpus-junit
          path: |
            junit-corpus.xml
            junit-smoke-full.xml
          retention-days: 30
