name: Coverage

# Daily coverage baseline for Codecov, kept off the per-push path: tracing
# adds 3-4x overhead on the subprocess-heavy notebook suite, and per-module
# drift is slow. workflow_dispatch reruns it on demand.

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Collect coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f  # v2.0.0
        with:
          toolchain: stable
          cache-workspaces: rust

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "latest"
          save-cache: false

      - name: Install dependencies and build Rust extension
        run: uv sync --python 3.13 --all-extras

      # Same scope as the non-Windows unit-tests job in ci.yml.
      # continue-on-error still uploads a baseline when a timing-sensitive
      # notebook test flakes under the tracer.
      - name: Run tests with coverage
        continue-on-error: true
        run: |
          uv run pytest tests/ \
            --ignore=tests/test_e2e_artifacts.py \
            --ignore=tests/test_lineage.py \
            --ignore=tests/test_s3_integration.py \
            --cov \
            --cov-report=xml \
            --cov-report=term \
            -q --no-header

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          flags: notebook
          # main is protected, and Codecov requires a token to upload for a
          # protected branch.
          token: ${{ secrets.CODECOV_TOKEN }}
