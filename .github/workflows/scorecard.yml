name: Scorecard supply-chain security
on:
  # Branch-Protection check (default branch only).
  branch_protection_rule:
  # Keeps the Maintained check updated.
  schedule:
    - cron: '28 19 * * 1'
  push:
    branches: [ "main" ]

# Read-only by default; the job adds only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
      # Publish results and the badge (publish_results below).
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # No repo_token (a write PAT): only needed for Branch-Protection on a
          # public repo or for a private repo.

          # Publishes to the OpenSSF REST API, which enables the badge.
          publish_results: true

      # SARIF in the Actions tab.
      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # And in the Code Scanning dashboard.
      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          sarif_file: results.sarif
