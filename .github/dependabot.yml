version: 2

# Weekly cadence on Monday mornings. Grouped updates so we get one
# PR per ecosystem per week instead of N PRs per minor bump.

updates:
  # Pin GitHub Actions to SHAs and let Dependabot bump them. This is
  # what closes the bulk of Scorecard's PinnedDependenciesID alerts —
  # combined with the SHA-pinning sweep in the workflows themselves.
  #
  # Group only minor + patch bumps; major bumps come as individual PRs
  # we review case-by-case. We learned this the hard way with the
  # PR #7 megabump that touched release.yml in ways CI couldn't
  # exercise (the wheel-publish pipeline only runs on v* tags).
  #
  # release.yml's artifact + gh-release actions are ignored entirely
  # for majors — those need manual smoke-testing against the publish
  # pipeline before we accept the bump.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Major bumps on release.yml-critical actions. Tests don't
      # exercise release.yml, so a green CI doesn't mean the
      # wheel-publish pipeline still works. Bump these manually
      # with a tag-driven dry-run when needed.
      - dependency-name: "actions/upload-artifact"
        update-types: [version-update:semver-major]
      - dependency-name: "actions/download-artifact"
        update-types: [version-update:semver-major]
      - dependency-name: "softprops/action-gh-release"
        update-types: [version-update:semver-major]
      - dependency-name: "github/codeql-action"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: ci
      include: scope

  # uv, not pip: the pip updater edits pyproject.toml and never uv.lock, so
  # every PR failed `uv lock --check`. increase-if-necessary moves a minimum
  # only when the new release falls outside it; otherwise the PR is a lock
  # bump, and users of the published package are not forced onto it.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # A package whose update breaks the build stays out of the big groups, so
    # it fails its own PR instead of holding back a dozen safe bumps. The first
    # group that matches wins, so fsspec comes before the dependency-type ones.
    groups:
      # fsspec and its filesystems release together and pin each other exactly.
      fsspec:
        patterns: [fsspec, s3fs, gcsfs, adlfs]
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]
      python-dev:
        dependency-type: development
        update-types: [minor, patch]
        # ty is pre-1.0 and each release adds diagnostics.
        exclude-patterns: [ty]
    ignore:
      # aiobotocore (through s3fs) pins botocore to a narrow range, so boto3
      # cannot be updated alone; it moves when the fsspec group does.
      - dependency-name: boto3
      - dependency-name: botocore
      # mcp 2 changed its server API; the migration is its own task.
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      npm-runtime:
        dependency-type: production
        update-types: [minor, patch]
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: deps
      include: scope

  # Keep the digest-pinned Docker base images current. The Dockerfiles
  # pin `FROM` by tag + sha256 (Scorecard Pinned-Dependencies); without
  # this ecosystem those digests go stale and miss base-image security
  # patches. Covers the shipped image (/) and the df-cluster example.
  - package-ecosystem: docker
    directories:
      - /
      - /examples/arxiv_classifier/df-cluster
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci
      include: scope

  # The images the compose stacks pull (Postgres, nginx, Prometheus, Grafana,
  # Jaeger). The docker ecosystem reads Dockerfiles only, so these sat
  # unbumped for two years.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    groups:
      docker-compose:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # 2.21 drops the query API Grafana's Jaeger datasource reads; see
      # docker-compose.observability.yml.
      - dependency-name: jaegertracing/jaeger
        versions: [">=2.21.0"]
    commit-message:
      prefix: ci
      include: scope

  # Features in .devcontainer/devcontainer.json.
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  # Hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 3
    groups:
      pre-commit:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
