# Strata Observability Stack
#
# Quick start:
#   docker compose -f docker-compose.observability.yml up -d
#
# Access:
#   - Strata API: http://localhost:8765
#   - Jaeger UI:  http://localhost:16686  (traces)
#   - Prometheus: http://localhost:9090   (metrics)
#   - Grafana:    http://localhost:3000   (dashboards, login: admin/admin)
#
# Test it:
#   curl http://localhost:8765/metrics/prometheus
#   curl http://localhost:8765/health
#
# Generate traces: run a few scan@v1 materializes against a table under
# /data/warehouse (see docs/deployment/observability.md, "Generating load").

services:
  # Strata server with tracing enabled
  strata:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./demo-warehouse:/data/warehouse:ro
      - strata-cache:/home/strata/.strata/cache
    environment:
      - STRATA_HOST=0.0.0.0
      - STRATA_PORT=8765
      - STRATA_CACHE_DIR=/home/strata/.strata/cache
      - STRATA_TRACING_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=strata
      - STRATA_LOG_FORMAT=json
      - STRATA_LOG_LEVEL=INFO
      # The name Prometheus scrapes the server on; personal mode refuses any
      # other host name as a possible DNS-rebinding page.
      - STRATA_ALLOWED_HOSTS=strata
    # Stdlib only, like every other healthcheck in the repo.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - jaeger

  # Jaeger - Distributed tracing backend
  jaeger:
    # 2.21 drops the /api/services query API that Grafana's Jaeger
    # datasource reads; hold here until Grafana moves to /api/v3.
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - strata

  # Grafana - Dashboards and visualization
  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

volumes:
  strata-cache:
  grafana-data:
