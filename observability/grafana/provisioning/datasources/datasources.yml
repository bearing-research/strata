# Grafana data sources provisioning
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Fixed so the dashboard's uid "prometheus" reference resolves without
    # relying on the default-datasource fallback.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
