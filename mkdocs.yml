site_name: Strata
site_url: https://bearingresearch.com/strata/
site_description: "A notebook built for coding agents: every result cached, versioned, and visible to the human watching"
repo_url: https://github.com/bearing-research/strata
repo_name: bearing-research/strata

theme:
  name: material
  custom_dir: docs_overrides
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
  icon:
    logo: strata/diamond
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/copy-markdown.js
  - javascripts/changelog-link.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Renders `++shift+enter++` as styled keyboard keys.
  - pymdownx.keys

plugins:
  - search

hooks:
  - docs_hooks/export_examples.py
  - docs_hooks/llms_txt.py
  - docs_hooks/redirects.py

nav:
  - Get started:
    - Overview: index.md
    - Install: getting-started/installation.md
    - Your first notebook: getting-started/notebook.md
    - With a coding agent: notebook/agent.md
    - Terminal viewer: notebook/tui.md
    - Coming from Jupyter: notebook/import.md
    - Example gallery: notebook/examples.md
  - Guides:
    - Cells:
      - Overview: guides/cells/index.md
      - Python: guides/cells/python.md
      - SQL: guides/cells/sql.md
      - R: guides/cells/r.md
      - Prompt: guides/cells/prompt.md
      - Widget: guides/cells/widget.md
      - Loops and variants: guides/cells/loops-and-variants.md
      - Tests: notebook/testing.md
    - Data:
      - Mounts: guides/data/mounts.md
      - Lake and Iceberg: notebook/lake-aware-cells.md
      - Fetch and datasets: guides/data/fetch-and-datasets.md
      - Write back: guides/data/write-back.md
    - Compute:
      - Workers: notebook/workers.md
      - Worker pool: notebook/worker-pool.md
      - SSH: guides/compute/ssh.md
      - Environment: notebook/environment.md
      - Secrets: notebook/secrets.md
    - Share:
      - App view: guides/share/app-view.md
      - Publish: notebook/publishing.md
      - Export and import: notebook/export.md
      - Team store: guides/share/team-store.md
      - Registry dashboard: notebook/registry-dashboard.md
    - Agents:
      - MCP: notebook/mcp.md
      - CLI authoring: notebook/agent-authoring.md
      - Scratchpad: notebook/scratchpad.md
    - Library:
      - Quickstart: getting-started/core.md
      - Artifacts and registry: core/registry.md
  - Concepts:
    - How caching works: concepts/caching.md
    - The DAG and staleness: concepts/dag-and-staleness.md
    - Artifacts and lineage: concepts/artifacts-and-lineage.md
    - File format and git: concepts/file-format-and-git.md
    - How Strata compares: notebook/comparison.md
    - Features: concepts/features.md
  - Reference:
    - Annotations:
      - Index: reference/annotations/index.md
      - Python: reference/annotations/python.md
      - SQL: reference/annotations/sql.md
      - R: reference/annotations/r.md
      - Prompt: reference/annotations/prompt.md
      - Loops and variants: reference/annotations/loops-and-variants.md
      - Widget and app view: reference/annotations/widget.md
    - CLI: notebook/cli.md
    - notebook.toml: reference/notebook-toml.md
    - Configuration: reference/configuration.md
    - REST: reference/rest-api.md
    - WebSocket: reference/websocket.md
    - Notebook client protocol: reference/notebook-protocol.md
    - Executor protocol: reference/executor-protocol.md
    - Worker relay: reference/worker-connect.md
    - Keyboard: notebook/keyboard.md
  - Deploy:
    - Modes: deployment/modes.md
    - Service mode: deployment/service-mode.md
    - Docker: deployment/docker.md
    - Fly.io: deployment/fly.md
    - Codespaces: deployment/codespaces.md
    - Operations: deployment/lifecycle.md
    - Observability: deployment/observability.md
    - Privacy: deployment/privacy.md

exclude_docs: |
  internal/
  assets/README.md

# Rendered from examples/ by the hook above and linked from notebook/examples.md. The
# changelog is linked from the header and the footer.
not_in_nav: |
  /examples/*.md
  /changelog.md

# A link to a heading that is gone fails the strict build.
validation:
  anchors: warn

# Versioned docs via `mike`, which maintains ``versions.json`` on ``gh-pages``
# for Material's version picker. Aliases:
#   * ``latest``: the most recent release; the default landing page.
#   * ``dev``: tracks ``main``, updated by docs.yml on every push.
#   * ``<version>``: one snapshot per release tag, pushed by the release workflow.
extra:
  version:
    provider: mike
    default: latest
