# Fly.io deployment configuration for Strata Notebook
#
# Deploy:   fly deploy
# Open:     fly open
# Logs:     fly logs
# Status:   fly status

app = "strata-notebook"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  STRATA_HOST = "0.0.0.0"
  STRATA_PORT = "8765"
  STRATA_DEPLOYMENT_MODE = "personal"
  STRATA_ALLOW_REMOTE_CLIENTS_IN_PERSONAL = "true"
  # The name browsers reach the app on; anything else is refused as a
  # possible DNS-rebinding page. Change it with the app name, and add any
  # custom domain (comma-separated).
  STRATA_ALLOWED_HOSTS = "strata-notebook.fly.dev"
  # Per-user notebook scoping behind Cloudflare Access (or any authenticating
  # proxy that injects the user's email). Without a proxy the header is absent
  # and Strata acts single-user, so this is safe either way. See
  # docs/deployment/modes.md, "Sharing personal mode with a small group".
  STRATA_PERSONAL_MODE_USER_HEADER = "Cf-Access-Authenticated-User-Email"
  STRATA_NOTEBOOK_PYTHON_VERSIONS = '["3.12","3.13"]'
  STRATA_CACHE_DIR = "/home/strata/.strata/cache"
  STRATA_METADATA_DB = "/home/strata/.strata/meta.sqlite"
  STRATA_NOTEBOOK_STORAGE_DIR = "/home/strata/.strata/notebooks"
  UV_CACHE_DIR = "/tmp/uv-cache"
  UV_PYTHON_DOWNLOADS = "automatic"

  # Tracing is on by default (the image has the ``otel`` extra). To export
  # spans, set the endpoint as a Fly secret so no token lands in this file:
  #
  #     flyctl secrets set OTEL_EXPORTER_OTLP_ENDPOINT=https://your-collector:4317
  #     flyctl secrets set OTEL_EXPORTER_OTLP_HEADERS="authorization=Bearer <token>"
  #
  # Without an endpoint, spans go to a no-op exporter.
  OTEL_SERVICE_NAME = "strata-fly"

[http_service]
  internal_port = 8765
  force_https = true
  # ``suspend`` with ``min_machines_running = 1`` is intentional: one machine
  # stays attached to the volume for fast wakes but suspends when idle.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-4x"
  memory = "2048mb"
  # Single machine: notebook storage is a per-machine volume, so several
  # machines would route users across diverging volumes.
  count = 1

[[mounts]]
  source = "strata_data"
  destination = "/home/strata/.strata"
  initial_size = "5GB"
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "2GB"
  auto_extend_size_limit = "20GB"

[checks]
  [checks.health]
    type = "http"
    port = 8765
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "15s"
